[workspace]
exclude = ["generic_call_circuit"]
members = ["generic_call_witness", "generic_call_library"]
resolver = "3"

[workspace.package]
authors = ["Heliax <hello@heliax.dev>"]
edition = "2024"
license = "GPL-3.0"
readme = "README.md"
repository = "https://github.com/anoma/generic-call-resource"
version = "2.0.0-rc.2"

[workspace.dependencies]
alloy-primitives = "1.0.23"
alloy-sol-types = "1.0.23"
anoma-generic-call-library = { version = "2.0.0-rc.2", path = "generic_call_library" }
anoma-generic-call-witness = { version = "2.0.0-rc.2", path = "generic_call_witness" }
anoma-rm-risc0 = { default-features = false, git = "https://github.com/anoma/arm-risc0", rev = "aaac2d2dc795c45c50615b0bf0ed5f8bc06cff9e", version = "2.0.0-rc.7.1" }
anoma-rm-risc0-gadgets = { git = "https://github.com/anoma/arm-risc0", rev = "aaac2d2dc795c45c50615b0bf0ed5f8bc06cff9e", version = "2.0.0-rc.7.1" }
hex = "0.4"
lazy_static = "1.5.0"
serde = { version = "1.0", features = ["derive"] }

# Always optimize; building and running the guest takes much longer without optimization.
[profile.dev]
opt-level = 3
